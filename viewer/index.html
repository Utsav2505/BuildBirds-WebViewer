<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BuildBirds · Page Viewer</title>
<style>
  :root{
    /* palette lifted from the pages themselves */
    --ink:#141210;
    --ink-2:#241F1A;
    --paper:#FFFFFF;
    --saffron:#EF6A1A;
    --stage:#C7C1B4;
    --on-ink:#F3EFE8;
    --on-ink-dim:#A79E92;
    --hair:rgba(255,255,255,.16);

    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Helvetica Neue",Arial,"Segoe UI",system-ui,sans-serif;

    --pw:148mm;
    --ph:210mm;
    --s:1;
    --pad:20px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--stage);
    color:var(--ink);
    font:400 14px/1.45 var(--sans);
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------------- top bar ---------------- */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    background:var(--ink); color:var(--on-ink);
    padding:10px max(12px, env(safe-area-inset-left)) 10px max(12px, env(safe-area-inset-right));
    border-bottom:3px solid var(--saffron);
  }
  .logo{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  /* logo art is opaque white-on-white, so it sits on its own white tile */
  .mark{
    width:30px; height:30px; border-radius:4px; background:#fff; padding:2px;
    object-fit:contain; flex:0 0 auto; display:block;
  }
  .wordmark{ font-weight:800; font-size:15px; letter-spacing:-.02em; white-space:nowrap; }
  .wordmark span{ color:var(--saffron); }
  .rule{ width:1px; align-self:stretch; background:var(--hair); flex:0 0 auto; }
  .doc{ min-width:0; }
  .doc h1{ font-size:13px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .doc p{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--on-ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .spacer{ flex:1 1 auto; }

  .tools{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .btn{
    display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 10px;
    border:1px solid var(--hair); border-radius:4px; background:transparent;
    color:var(--on-ink); font-family:var(--mono); font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
    transition:background .12s, color .12s, border-color .12s;
  }
  .btn:hover{ background:var(--saffron); border-color:var(--saffron); color:var(--ink); }
  .btn svg{ width:15px; height:15px; }
  .btn.icon{ width:32px; padding:0; justify-content:center; }
  .btn:focus-visible, .nav:focus-visible, .dot:focus-visible, .scroller:focus-visible{
    outline:2px solid var(--saffron); outline-offset:2px;
  }

  /* ---------------- stage ---------------- */
  main{ flex:1 1 auto; position:relative; min-height:0; }
  .scroller{
    position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
    scrollbar-gutter:stable; padding:var(--pad) 0;
    /* drafting-paper grid, not a gradient */
    background-image:
      linear-gradient(rgba(20,18,16,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,18,16,.06) 1px, transparent 1px);
    background-size:24px 24px;
  }
  .canvas{
    position:relative; margin:0 auto;
    width:calc(var(--pw) * var(--s));
    height:calc(var(--ph) * var(--s));
  }
  .frame{
    position:absolute; top:0; left:0;
    width:var(--pw); height:var(--ph);
    transform:scale(var(--s)); transform-origin:top left;
    background:var(--paper); overflow:hidden;
    box-shadow:0 2px 0 rgba(20,18,16,.35), 0 10px 28px rgba(20,18,16,.28);
    opacity:0; visibility:hidden; transition:opacity .2s ease;
  }
  .frame.on{ opacity:1; visibility:visible; }
  .frame iframe{ width:100%; height:100%; border:0; display:block; }

  /* side arrows sit above the scroller, never scroll away */
  .nav{
    position:absolute; top:50%; margin-top:-21px; z-index:5;
    width:42px; height:42px; border-radius:4px; cursor:pointer;
    border:1px solid var(--ink); background:var(--ink); color:var(--on-ink);
    display:grid; place-items:center;
    box-shadow:0 2px 0 rgba(20,18,16,.3);
    transition:background .12s, color .12s, opacity .12s;
  }
  .nav:hover{ background:var(--saffron); color:var(--ink); }
  .nav[disabled]{ opacity:.22; pointer-events:none; }
  .nav.prev{ left:10px; }
  .nav.next{ right:10px; }
  .nav svg{ width:18px; height:18px; }

  /* ---------------- bottom bar ---------------- */
  footer{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:12px;
    background:var(--ink); color:var(--on-ink);
    border-top:1px solid var(--hair);
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  }
  .dots{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .dots::-webkit-scrollbar{ display:none; }
  .dot{
    height:28px; padding:0 10px; border-radius:3px; cursor:pointer; white-space:nowrap;
    border:1px solid var(--hair); background:transparent; color:var(--on-ink-dim);
    font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    transition:color .12s, border-color .12s, background .12s;
  }
  .dot:hover{ color:var(--on-ink); border-color:var(--on-ink-dim); }
  .dot[aria-current="true"]{ background:var(--saffron); border-color:var(--saffron); color:var(--ink); }
  .count{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--on-ink-dim);
    font-variant-numeric:tabular-nums; white-space:nowrap; }
  .count b{ color:var(--on-ink); }

  /* ---------------- misc ---------------- */
  .toast{
    position:fixed; left:50%; bottom:72px; transform:translate(-50%,10px);
    background:var(--ink); color:var(--on-ink); border-left:3px solid var(--saffron);
    font-family:var(--mono); font-size:11.5px; letter-spacing:.04em;
    padding:9px 14px; border-radius:3px; box-shadow:0 8px 24px rgba(20,18,16,.35);
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:20;
  }
  .toast.on{ opacity:1; transform:translate(-50%,0); }
  .msg{ position:absolute; inset:0; display:grid; place-content:center; justify-items:center;
    text-align:center; padding:24px; color:var(--ink); }
  .msg p{ max-width:44ch; line-height:1.55; }
  .msg code{ display:block; margin-top:12px; background:var(--ink); color:var(--on-ink);
    font-family:var(--mono); font-size:12px; padding:10px 14px; border-radius:3px; text-align:left; }

  @media (max-width:760px){
    .wordmark, .doc p, .btn .lbl{ display:none; }
    .btn{ width:32px; padding:0; justify-content:center; }
    .nav{ width:36px; height:36px; margin-top:-18px; }
    .nav.prev{ left:4px; } .nav.next{ right:4px; }
    :root{ --pad:10px; }
  }
  @media (max-width:460px){
    .dot .dlbl{ display:none; }
    .dot{ padding:0 9px; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="logo">
    <img class="mark" src="logo.png" alt="BuildBirds">
    <div class="wordmark">Build<span>Birds</span></div>
  </div>
  <div class="rule" aria-hidden="true"></div>
  <div class="doc">
    <h1 id="docTitle">Loading…</h1>
    <p id="docSub"></p>
  </div>
  <div class="spacer"></div>
  <div class="tools">
    <button class="btn" id="fitBtn" title="Toggle fit: width / whole page (Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V4h4M21 8V4h-4M3 16v4h4M21 16v4h-4"/></svg>
      <span class="lbl" id="fitLbl">Width</span>
    </button>
    <button class="btn" id="printBtn" title="Print this page (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
      <span class="lbl">Print</span>
    </button>
    <button class="btn" id="shareBtn" title="Share a link to this page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      <span class="lbl">Share</span>
    </button>
    <button class="btn icon" id="fsBtn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="scroller" id="scroller" tabindex="0" role="region" aria-label="Page view, scrollable">
    <div class="canvas" id="canvas"></div>
  </div>
  <button class="nav prev" id="prevBtn" aria-label="Previous page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="nav next" id="nextBtn" aria-label="Next page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</main>

<footer>
  <div class="dots" id="dots"></div>
  <span class="count" id="count"></span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const scroller = $('scroller'), canvas = $('canvas');
let cfg = null, frames = [], i = 0, mode = 'width';   // 'width' | 'page'

fetch('pages.json').then(r => r.json()).then(init).catch(() => {
  canvas.remove();
  scroller.insertAdjacentHTML('beforeend',
    '<div class="msg"><p><b>pages.json</b> could not be read. Browsers block local file reads over ' +
    '<b>file://</b> — serve the parent folder instead:</p>' +
    '<code>python -m http.server 8000</code>' +
    '<p style="margin-top:10px">then open http://localhost:8000/viewer/</p></div>');
});

function init(c){
  cfg = c;
  document.title = (c.brand || 'BuildBirds') + ' · ' + (c.title || 'Viewer');
  $('docTitle').textContent = c.title || '';
  const root = document.documentElement.style;
  root.setProperty('--pw', c.pageWidth || '148mm');
  root.setProperty('--ph', c.pageHeight || '210mm');

  c.pages.forEach((p, n) => {
    const f = document.createElement('div');
    f.className = 'frame';
    canvas.appendChild(f);
    frames.push(f);

    const b = document.createElement('button');
    b.className = 'dot';
    b.innerHTML = (n + 1) + (p.title ? '<span class="dlbl"> · ' + p.title + '</span>' : '');
    b.onclick = () => go(n);
    $('dots').appendChild(b);
  });

  const start = parseInt(location.hash.replace('#p', ''), 10);
  go(Number.isInteger(start) && start >= 1 && start <= c.pages.length ? start - 1 : 0);
  fit();
}

// mount an iframe only when its page is first needed (current ± 1)
function mount(n){
  const f = frames[n];
  if (!f || f.firstChild) return;
  const el = document.createElement('iframe');
  el.title = cfg.pages[n].title || ('Page ' + (n + 1));
  el.setAttribute('scrolling', 'no');
  // the source pages paint their own grey backdrop + drop shadow; strip it so the viewer's chrome shows
  el.addEventListener('load', () => {
    try {
      const d = el.contentDocument;
      d.body.style.cssText += ';background:transparent;padding:0;';
      const p = d.querySelector('.page');
      if (p) p.style.boxShadow = 'none';
    } catch { /* cross-origin: leave the page as authored */ }
  });
  el.src = cfg.pages[n].file;
  f.appendChild(el);
}

function go(n){
  i = Math.max(0, Math.min(cfg.pages.length - 1, n));
  [i - 1, i, i + 1].forEach(mount);
  frames.forEach((f, k) => f.classList.toggle('on', k === i));
  [...$('dots').children].forEach((d, k) => d.setAttribute('aria-current', k === i));
  $('docSub').textContent = cfg.pages[i].subtitle || cfg.pages[i].title || '';
  $('count').innerHTML = '<b>' + (i + 1) + '</b> / ' + cfg.pages.length;
  $('prevBtn').disabled = i === 0;
  $('nextBtn').disabled = i === cfg.pages.length - 1;
  scroller.scrollTop = 0;
  history.replaceState(null, '', '#p' + (i + 1));
}

// scale the fixed-size page: fill the width (scroll vertically), or fit the whole page
function fit(){
  const f = frames[0];
  if (!f) return;
  const pad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pad')) || 20;
  const w = (scroller.clientWidth - pad * 2) / f.offsetWidth;
  const h = (scroller.clientHeight - pad * 2) / f.offsetHeight;
  document.documentElement.style.setProperty('--s', mode === 'width' ? w : Math.min(w, h));
}
new ResizeObserver(fit).observe(scroller);

$('prevBtn').onclick = () => go(i - 1);
$('nextBtn').onclick = () => go(i + 1);
$('fitBtn').onclick = () => {
  mode = mode === 'width' ? 'page' : 'width';
  $('fitLbl').textContent = mode === 'width' ? 'Width' : 'Page';
  fit();
};

addEventListener('keydown', e => {
  if (!cfg) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(i + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(i - 1);
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(cfg.pages.length - 1);
  else if (e.key === 'f') toggleFs();
  else if (e.key === 'z') $('fitBtn').click();
  else if (e.key === 'p') { e.preventDefault(); printPage(); }
  else return;
  e.preventDefault();
});

// swipe (horizontal only — vertical is the scroll gesture)
let x0 = null, y0 = null;
scroller.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
scroller.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(i + (dx < 0 ? 1 : -1));
  x0 = null;
}, { passive:true });

function printPage(){
  const win = frames[i].firstChild && frames[i].firstChild.contentWindow;
  try { win.focus(); win.print(); }                       // same-origin (served over http)
  catch { window.open(cfg.pages[i].file, '_blank'); toast('Opened page — press Ctrl+P'); }
}
$('printBtn').onclick = printPage;

$('shareBtn').onclick = async () => {
  const url = location.href;
  if (navigator.share) {
    try { await navigator.share({ title: cfg.title + ' — ' + (cfg.pages[i].title || ''), url }); } catch {}
    return;
  }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch { toast(url); }
};

function toggleFs(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => toast('Fullscreen blocked'));
}
$('fsBtn').onclick = toggleFs;

let tid;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(tid); tid = setTimeout(() => t.classList.remove('on'), 2200);
}
</script>
</body>
</html>
